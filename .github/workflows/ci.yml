# CI gate (git-forum ticket 6ncwev44): format -> lint -> type check -> test,
# stopping at the first failure. Branch protection on master requires the
# `gate` check; that setting lives on GitHub, not in this file.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lets a maintainer run the gate on any branch (used to show each step
  # can fail on its own).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The toolchain is pinned; bump it here on purpose, not by the runner image.
  RUST_TOOLCHAIN: "1.94.1"

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Type check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test
